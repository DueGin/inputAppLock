name: Release

# 打 tag 自动发版：git tag v1.0.0 && git push origin v1.0.0
# 手动触发（workflow_dispatch）只构建 + 上传 artifact，不创建 release，方便先验证流水线。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 需要写 release / 上传 asset 的权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build universal macOS app, package DMG, publish release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          # SetFile 用来给 dmg 卷打「自定义图标」位；缺失时 make_dmg.sh 会自动跳过，不算失败
          command -v SetFile || echo "SetFile not found (volume icon will be skipped)"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 手动触发没有 tag，退回源 Info.plist 里的占位版本，保证产物版本号不为空
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "!! 解析不到版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"

      - name: Build universal .app (arm64 + x86_64)
        env:
          UNIVERSAL: '1'
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./scripts/build_app.sh
          echo "--- lipo -archs ---"
          lipo -archs build/InputLock.app/Contents/MacOS/InputLock
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/InputLock.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/InputLock.app/Contents/Info.plist

      # 签名说明：这里刻意保持 ad-hoc 签名（codesign --sign -，不引入任何证书 secrets），
      # 所以产物没有公证，用户首次打开要手动放行 Gatekeeper，见 release 正文的安装说明。
      # make_dmg.sh 会对 .app 与 .dmg 都做 ad-hoc 签名，并在挂载校验里跑 codesign --verify --deep --strict。
      #
      # 将来接 Developer ID 正式签名 + 公证时（当前不实现），大致流程：
      #   1. 新增 secrets：BUILD_CERTIFICATE_BASE64（Developer ID Application .p12 的 base64）、
      #      P12_PASSWORD、KEYCHAIN_PASSWORD，以及公证用的 APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD；
      #   2. 解出证书并导入临时 keychain：
      #      security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #      security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
      #   3. 让 build_app.sh 用正式身份签名（--sign "Developer ID Application: ..." --options runtime --timestamp）；
      #   4. 用 make_dmg.sh 打完 dmg 后直接公证 dmg（推荐，比公证 zip 更稳）：
      #      xcrun notarytool submit build/InputLock-<version>.dmg --apple-id ... --team-id ... --password ... --wait
      #   5. 装订票据：xcrun stapler staple build/InputLock-<version>.dmg，然后重算 .sha256
      # 到那一步就可以去掉正文里的 xattr / 右键打开说明。

      - name: Package DMG installer + sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # CI 没有图形会话，明确关掉 Finder 窗口布局（脚本本身也会自动跳过，这里只是显式化）
          FINDER_LAYOUT: '0'
        run: |
          set -euo pipefail
          ./scripts/make_dmg.sh
          ls -lh build/InputLock-*.dmg build/InputLock-*.dmg.sha256

      # 手动触发的产物：artifact 会被 GitHub 自己再压一层 zip，下载后解压拿到 .dmg
      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: InputLock-${{ steps.version.outputs.version }}-macos-universal-dmg
          path: |
            build/InputLock-*.dmg
            build/InputLock-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: InputLock ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/InputLock-*.dmg
            build/InputLock-*.dmg.sha256
          body: |
            ## 安装

            系统要求：macOS 13 或更新；通用二进制，Apple Silicon 与 Intel 都能跑。

            1. 下载 `InputLock-${{ steps.version.outputs.version }}.dmg`，双击打开——会挂载成一个名为 `InputLock ${{ steps.version.outputs.version }}` 的磁盘映像，窗口里左边是 **InputLock**，右边是 **Applications** 文件夹快捷方式；
            2. 把左边的 `InputLock` 拖到右边的 `Applications` 上，即装到 `/Applications/InputLock.app`；
            3. 在 Finder 边栏点 `InputLock ${{ steps.version.outputs.version }}` 旁边的 ⏏ 弹出磁盘；
            4. **首次打开会被 Gatekeeper 拦截**——本构建是 ad-hoc 签名、未做 Apple 公证，任选一种放行：
               - 右键（Control-点击）`InputLock.app` →「打开」→ 弹窗里再点一次「打开」；
               - 或终端执行 `xattr -dr com.apple.quarantine /Applications/InputLock.app`，然后正常双击打开；
               - 还不行就去「系统设置 › 隐私与安全性」，页面底部点「仍要打开」；
               - 连 dmg 本身都被拦的话，同样右键 dmg →「打开」放行一次；
            5. 首次启动会提示需要辅助功能权限：打开「系统设置 › 隐私与安全性 › 辅助功能」，勾选 **InputLock**；
            6. 菜单栏出现锁形图标后，点菜单「锁定输入法 › 锁定当前输入法」即可开始锁定。

            校验下载文件（把 `.dmg` 与 `.dmg.sha256` 放同一目录）：

            ```bash
            shasum -a 256 -c InputLock-${{ steps.version.outputs.version }}.dmg.sha256
            ```

            卸载：退出程序 → 删除 `/Applications/InputLock.app` → 在「系统设置 › 通用 › 登录项」里移除残留条目。

            更新：下载新版本 dmg 覆盖安装即可（ad-hoc 签名变化后，辅助功能权限可能需要重新勾选一次）。
